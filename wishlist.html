<title>علاقه‌مندی‌ها — OMID RASTAR</title>
<style>
.wish-wrap{padding:0 4vw 70px; max-width:1100px; margin:0 auto;}
.wish-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 280px)); gap:16px; justify-content:start;}
.wish-card{padding:12px; display:flex; flex-direction:column; gap:10px; position:relative; max-width:300px; width:100%;}
.wish-card .thumb{border-radius:14px; overflow:hidden; aspect-ratio:4/3; background:#111; max-height:180px;}
.wish-card .thumb img{width:100%; height:100%; object-fit:cover;}
.wish-card h3{font-size:0.95rem; font-weight:900;}
.wish-card .row{display:flex; justify-content:space-between; align-items:center; margin-top:auto; gap:8px;}
.wish-empty{text-align:center; padding:60px 20px; color:#a9a39a;}
.wish-empty b{display:block; font-size:1.4rem; color:#f7f2e8; margin-bottom:8px;}
.remove-wish{position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.4); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: all 0.2s;}
.remove-wish:hover{background:var(--magenta); border-color:var(--magenta);}
@media(max-width:600px){
  .wish-grid{grid-template-columns: repeat(2, 1fr); gap:10px;}
  .wish-card{max-width:none;}
  .wish-card .thumb{max-height:140px;}
}
</style>
</head>
